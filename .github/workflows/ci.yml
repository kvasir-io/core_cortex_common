name: CI

# test: the core-common host tests (tests/CMakeLists.txt), Kvasir_SDK package-host-tests.yml: gcc and clang, plain and
# with ASan+UBSan. tests/CMakeLists.txt fetches what is not next to it: Kvasir_SDK (with svd_converter) and the three
# core repositories for the decoder tests. irq_state_syntax (Special.hpp + InterruptMask.hpp for Armv6-M and Armv8-M,
# -fsyntax-only) runs in the clang jobs: it is a clang --target check, the host compiler plays no part in it.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-host-tests.yml@master
        with: {sanitizers: true}

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master
