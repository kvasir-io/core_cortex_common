name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        name: ${{ matrix.compiler.cc }}${{ matrix.compiler.sanitizer && ' asan+ubsan' || '' }}
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: gcc, cxx: g++, sanitizer: 'address,undefined'}
                    - {cc: clang, cxx: clang++}
                    - {cc: clang, cxx: clang++, sanitizer: 'address,undefined'}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm
                pacman -S --noconfirm cmake ninja base-devel ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }}

            # the host tests need only this repository's headers
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Configure CMake
              run: >
                cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
                ${{ matrix.compiler.sanitizer && format('"-DCMAKE_CXX_FLAGS=-fsanitize={0} -fno-sanitize-recover=all"', matrix.compiler.sanitizer) || '' }}
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build tests
              run: cmake --build build -j"$(nproc)"

            - name: Run tests
              run: ctest --test-dir build --output-on-failure
